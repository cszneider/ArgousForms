<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crie protocolos, conecte equipes e acompanhe processos." />
    <link rel="icon" href="/ArgousForms/favicon.svg" />
    <title>ArgousDocs — Documentos em movimento</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('argousdocs:theme');
          document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
            ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
